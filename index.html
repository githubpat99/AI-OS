<script>
"use strict";
const demoData=JSON.parse(document.getElementById('map-data').textContent);
let data=demoData;
let topicById=new Map(data.topics.map(topic=>[topic.id,topic]));
let fileByPath=new Map(data.files.map(file=>[file.path,file]));
const roleNames=['Wissen','Originalquelle','Ergebnis','Arbeitsmittel','Kontext und Register','Quellenauszug','Sonstiges'];
const statusNames={evaluated:'Textuell ausgewertet',partial:'Teilweise ausgewertet',skipped:'Ubersprungen'};
let overrides={};
try{localStorage.removeItem('ai-os-topic-map-assignments-v1');}catch{}
const state={view:'topics',query:'',organisation:'',roles:new Set(),status:'',selected:new Set(),mode:'any',unassigned:false,page:0};
const mobileQuery=matchMedia('(max-width:850px)');
const filterFields=document.getElementById('filter-fields');
const filterToggle=document.getElementById('toggle-filters');
function setFilterVisibility(){filterFields.hidden=mobileQuery.matches;filterToggle.setAttribute('aria-expanded',String(!filterFields.hidden));}
mobileQuery.addEventListener('change',setFilterVisibility);
filterToggle.addEventListener('click',()=>{filterFields.hidden=!filterFields.hidden;filterToggle.setAttribute('aria-expanded',String(!filterFields.hidden));});
setFilterVisibility();
let editingPath='',noticeTimer;
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const fold=value=>String(value).toLocaleLowerCase('de').replace(/\u00e4/g,'ae').replace(/\u00f6/g,'oe').replace(/\u00fc/g,'ue').replace(/\u00df/g,'ss').normalize('NFD').replace(/\p{M}/gu,'');
const fileLink=(path,label=path)=>`<span title="${escapeHtml(path)}">${escapeHtml(label)}</span>`;
function idsFor(file){return Object.hasOwn(overrides,file.path)?overrides[file.path]:file.topics.map(topic=>topic.id);}
function matches(file,ignoreTopics=false){
 if(state.organisation&&file.organisation!==state.organisation)return false;
 if(state.roles.size&&!file.roles.some(role=>state.roles.has(role)))return false;
 if(state.status&&file.status!==state.status)return false;
 const ids=idsFor(file);if(state.unassigned&&ids.length)return false;
 if(!ignoreTopics&&state.selected.size){const selected=[...state.selected];if(state.mode==='all'?!selected.every(id=>ids.includes(id)):!selected.some(id=>ids.includes(id)))return false;}
 const text=fold([file.title,file.path,statusNames[file.status],file.reason,...file.roles,...ids.map(id=>topicById.get(id)?.label||''),...file.topics.map(topic=>topic.evidence)].join(' '));
 return state.query.split(/\s+/).filter(Boolean).every(word=>text.includes(fold(word)));
}
function notice(message){const element=document.getElementById('notice');element.textContent=message;element.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>element.hidden=true,4500);}
function saveOverrides(){notice('Zuordnung fuer diese Verbindung vorgemerkt.');}
function render(){
 const files=data.files.filter(file=>matches(file));
 document.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.view===state.view)));
 const selected=[...state.selected].map(id=>topicById.get(id).label);
 const heading=state.view==='audit'?'Auswertungsregister':state.view==='files'?'Dokumente':'Themen';
 document.getElementById('main').innerHTML=`<div class="summary"><div><h2>${escapeHtml(heading)}</h2>${selected.length?`<span>${escapeHtml(selected.join(' / '))}</span>`:''}</div><span role="status" aria-live="polite">${files.length} Dateien${selected.length?' / '+selected.length+' Themen':''}</span></div>`;
 if(state.view==='topics')renderTopics(files);else if(state.view==='files')renderFiles(files);else renderAudit(files);
}
function renderTopics(files){
 const main=document.getElementById('main');const base=data.files.filter(file=>matches(file,true));
 const entries=data.topics.map(topic=>({topic,members:base.filter(file=>idsFor(file).includes(topic.id))})).filter(entry=>entry.members.length||state.selected.has(entry.topic.id));
 main.insertAdjacentHTML('beforeend','<div class="network"><canvas id="network" role="img" aria-label="Themennetz: Verbindungen entsprechen gemeinsam zugeordneten Dokumenten"></canvas></div>');
 main.insertAdjacentHTML('beforeend',`<div class="topic-grid">${entries.map(({topic,members})=>`<button class="topic ${state.selected.has(topic.id)?'selected':''}" data-topic="${topic.id}" aria-pressed="${state.selected.has(topic.id)}"><span class="group">${String(data.topics.indexOf(topic)+1).padStart(2,'0')} / ${escapeHtml(topic.group)}</span><strong>${escapeHtml(topic.label)}</strong><div class="topic-counts"><span>${members.length} Dateien</span>${['Wissen','Originalquelle','Ergebnis'].map(role=>`<span>${members.filter(file=>file.roles.includes(role)).length} ${role}</span>`).join('')}</div></button>`).join('')}</div>`);
 if(!entries.length)main.insertAdjacentHTML('beforeend','<p class="empty">Keine passenden Themen.</p>');
 main.insertAdjacentHTML('beforeend','<div class="role-heading"><h3>Themendokumente</h3></div>');renderFiles(files,main);
 drawNetwork(entries);
}
function renderFiles(files,main=document.getElementById('main')){
 const pageSize=50;const maxPage=Math.max(0,Math.ceil(files.length/pageSize)-1);state.page=Math.min(state.page,maxPage);
 const visible=files.slice(state.page*pageSize,(state.page+1)*pageSize);
 for(const role of roleNames){const members=visible.filter(file=>file.roles[0]===role);if(!members.length)continue;
 main.insertAdjacentHTML('beforeend',`<section><div class="role-heading" data-role="${escapeHtml(role)}"><h3>${escapeHtml(role)}</h3><span class="badge">${files.filter(file=>file.roles[0]===role).length}</span></div>${members.map(fileRow).join('')}</section>`);}
 if(!files.length)main.insertAdjacentHTML('beforeend','<p class="empty">Keine passenden Dokumente.</p>');
 pagination(main,files.length,pageSize);
}
function fileRow(file){
 const manual=Object.hasOwn(overrides,file.path);const ids=idsFor(file);
 const topics=ids.map(id=>`<span class="badge ${manual?'':'proposed'}">${escapeHtml(topicById.get(id).label)}</span>`).join('');
 const evidence=file.topics.filter(topic=>ids.includes(topic.id)).map(topic=>`<p><strong>${escapeHtml(topicById.get(topic.id).label)}:</strong> ${escapeHtml(topic.basis)}. ${escapeHtml(topic.evidence)}${topic.evidencePath!==file.path?' '+fileLink(topic.evidencePath,'Belegdatei'):''}</p>`).join('');
 const related=file.links.map(path=>`<p class="path">${fileLink(path)} <span class="badge">${escapeHtml(statusNames[fileByPath.get(path).status])}</span></p>`).join('');
 const external=(file.externalLinks||[]).map(url=>`<p class="path">${escapeHtml(url)}</p>`).join('');
 return `<article class="file-row"><div><h3>${fileLink(file.path,file.title)}</h3><p class="path">${fileLink(file.path)}</p><div class="file-meta"><span class="badge ${manual?'':'proposed'}">${manual?'Lokal zugeordnet':'Automatischer Vorschlag'}</span><span class="badge ${file.status==='evaluated'?'':'partial'}">${escapeHtml(statusNames[file.status])}</span>${topics}</div>${file.reason?`<p class="muted">${escapeHtml(file.reason)}</p>`:''}${evidence?`<details><summary>Zuordnungsbelege (${file.topics.filter(topic=>ids.includes(topic.id)).length})</summary><div class="evidence">${evidence}</div></details>`:''}${related?`<details><summary>Verknupfte Dateien (${file.links.length})</summary>${related}</details>`:''}${external?`<details><summary>Externe Quellenverweise (${file.externalLinks.length})</summary>${external}</details>`:''}</div><div class="file-tools"><button data-edit="${escapeHtml(file.path)}">Zuordnen</button></div></article>`;
}
function renderAudit(files){
 const main=document.getElementById('main');
 main.insertAdjacentHTML('beforeend',`<div class="audit-note">${escapeHtml(data.method)}<p>PDF, EML, MSG und RTF: keine Inhaltsauswertung. Office: partielle XML-Textauswertung ohne Bilder, Layout- oder Formelprufung. Technische Verzeichnisse sind separat aufgefuhrt.</p></div>`);
 const pageSize=75;state.page=Math.min(state.page,Math.max(0,Math.ceil(files.length/pageSize)-1));
 for(const file of files.slice(state.page*pageSize,(state.page+1)*pageSize))main.insertAdjacentHTML('beforeend',`<article class="audit-row"><div><div class="path">${fileLink(file.path)}</div><p>${escapeHtml(file.reason||file.extraction)}</p>${file.hash?`<details><summary>SHA-256 und Ausleseverfahren</summary><p class="path">${escapeHtml(file.hash)}</p><p>${escapeHtml(file.extraction)}</p></details>`:''}</div><div><span class="badge ${file.status==='evaluated'?'':'partial'}">${escapeHtml(statusNames[file.status])}</span><p>${(file.bytes/1024).toFixed(1)} KiB</p></div></article>`);
 if(!files.length)main.insertAdjacentHTML('beforeend','<p class="empty">Keine passenden Registereintrage.</p>');
 pagination(main,files.length,pageSize);
 main.insertAdjacentHTML('beforeend',`<section><div class="role-heading"><h3>Ausgeschlossene Bereiche</h3></div>${data.excludedDirectories.map(entry=>`<div class="audit-row"><div><div class="path">${escapeHtml(entry.path)}</div><p>${escapeHtml(entry.reason)}</p></div></div>`).join('')}</section>`);
}
function pagination(main,total,size){if(total<=size)return;main.insertAdjacentHTML('beforeend',`<nav class="pagination" aria-label="Ergebnisseiten"><button class="command" data-page="-1" ${state.page===0?'disabled':''} aria-label="Vorherige Seite" title="Vorherige Seite">&larr;</button><span>${state.page+1} / ${Math.ceil(total/size)}</span><button class="command" data-page="1" ${(state.page+1)*size>=total?'disabled':''} aria-label="Nachste Seite" title="Nachste Seite">&rarr;</button></nav>`);}
function drawNetwork(entries){
 const canvas=document.getElementById('network');if(!canvas)return;const rect=canvas.getBoundingClientRect();const ratio=devicePixelRatio||1;canvas.width=rect.width*ratio;canvas.height=rect.height*ratio;const context=canvas.getContext('2d');context.scale(ratio,ratio);
 const colors={'Steuern':'#225e92','Technologie':'#18674b','Private Dossiers':'#a13840','Entscheidung und Lieferung':'#87580d','Arbeitsorganisation':'#636567'};
 const width=rect.width,height=rect.height,columns=width<480?4:7,rows=Math.max(1,Math.ceil(entries.length/columns));
 const nodes=entries.map((entry,index)=>({...entry,x:(index%columns+.5)*width/columns,y:(Math.floor(index/columns)+.5)*height/rows}));
 for(let left=0;left<nodes.length;left++)for(let right=left+1;right<nodes.length;right++){const shared=nodes[left].members.filter(file=>idsFor(file).includes(nodes[right].topic.id)).length;if(shared<3)continue;context.beginPath();context.moveTo(nodes[left].x,nodes[left].y);context.lineTo(nodes[right].x,nodes[right].y);context.strokeStyle=state.selected.has(nodes[left].topic.id)||state.selected.has(nodes[right].topic.id)?'#577a6880':'#9cafa528';context.lineWidth=Math.min(3,1+shared/40);context.stroke();}
 for(const node of nodes){context.beginPath();context.arc(node.x,node.y,16,0,Math.PI*2);context.fillStyle=colors[node.topic.group];context.fill();if(state.selected.has(node.topic.id)){context.strokeStyle='#202b28';context.lineWidth=3;context.stroke();}context.fillStyle='#fff';context.font='12px Bahnschrift, sans-serif';context.textAlign='center';context.textBaseline='middle';context.fillText(String(data.topics.indexOf(node.topic)+1).padStart(2,'0'),node.x,node.y);}
 canvas.onclick=event=>{const current=canvas.getBoundingClientRect();const node=nodes.find(item=>Math.hypot(event.clientX-current.left-item.x,event.clientY-current.top-item.y)<22);if(node)toggleTopic(node.topic.id);};
 canvas.onmousemove=event=>{const current=canvas.getBoundingClientRect();const node=nodes.find(item=>Math.hypot(event.clientX-current.left-item.x,event.clientY-current.top-item.y)<22);canvas.title=node?`${node.topic.label} (${node.members.length} Dateien)`:'';canvas.style.cursor=node?'pointer':'default';};
}
function toggleTopic(id){state.selected.has(id)?state.selected.delete(id):state.selected.add(id);state.page=0;render();}
function openAssignment(path){editingPath=path;document.getElementById('assignment-path').textContent=path;const ids=idsFor(fileByPath.get(path));document.getElementById('assignment-options').innerHTML=data.topics.map(topic=>`<label class="filter"><input type="checkbox" name="topic" value="${topic.id}" ${ids.includes(topic.id)?'checked':''}>${escapeHtml(topic.label)}</label>`).join('');document.getElementById('assignment').showModal();}
document.getElementById('main').addEventListener('click',event=>{const topic=event.target.closest('[data-topic]');if(topic)toggleTopic(topic.dataset.topic);const edit=event.target.closest('[data-edit]');if(edit)openAssignment(edit.dataset.edit);const pager=event.target.closest('[data-page]');if(pager){state.page+=Number(pager.dataset.page);render();document.getElementById('main').scrollIntoView({behavior:'smooth'});}});
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{state.view=button.dataset.view;state.page=0;render();}));
document.getElementById('search').addEventListener('input',event=>{state.query=event.target.value;state.page=0;render();});
for(const [element,key] of [['organisation','organisation'],['status','status'],['topic-mode','mode']])document.getElementById(element).addEventListener('change',event=>{state[key]=event.target.value;state.page=0;render();});
document.getElementById('unassigned').addEventListener('change',event=>{state.unassigned=event.target.checked;state.page=0;render();});
document.getElementById('role-filters').innerHTML=roleNames.map(role=>`<label class="filter"><input type="checkbox" value="${escapeHtml(role)}">${escapeHtml(role)}</label>`).join('');
document.getElementById('role-filters').addEventListener('change',event=>{event.target.checked?state.roles.add(event.target.value):state.roles.delete(event.target.value);state.page=0;render();});
function updateOrganisations(){document.getElementById('organisation').innerHTML='<option value="">Alle Organisationen</option>'+[...new Set(data.files.map(file=>file.organisation))].sort().map(value=>`<option>${escapeHtml(value)}</option>`).join('');}
document.getElementById('reset').addEventListener('click',()=>{Object.assign(state,{query:'',organisation:'',status:'',mode:'any',unassigned:false,page:0});state.selected.clear();state.roles.clear();document.getElementById('search').value='';document.getElementById('organisation').value='';document.getElementById('status').value='';document.getElementById('topic-mode').value='any';document.querySelectorAll('aside input[type=checkbox]').forEach(input=>input.checked=false);render();});
document.getElementById('close-dialog').addEventListener('click',()=>document.getElementById('assignment').close());
document.getElementById('assignment-form').addEventListener('submit',event=>{event.preventDefault();overrides[editingPath]=[...document.querySelectorAll('#assignment-options input:checked')].map(input=>input.value);saveOverrides();document.getElementById('assignment').close();render();});
document.getElementById('restore-assignment').addEventListener('click',()=>{delete overrides[editingPath];saveOverrides();document.getElementById('assignment').close();render();});
document.getElementById('export').addEventListener('click',()=>{const payload={exported:new Date().toISOString(),inventoryGenerated:data.generated,overrides,assignments:data.files.map(file=>({path:file.path,topics:idsFor(file),basis:Object.hasOwn(overrides,file.path)?'Lokale Zuordnung':'Automatischer Vorschlag'}))};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='ai-os-themenzuordnungen.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
function updateStats(){document.getElementById('stats').innerHTML=`<span><b>${data.topics.length}</b> Themen</span><span><b>${data.files.filter(file=>file.status==='evaluated').length}</b> textuell ausgewertet</span><span><b>${data.files.filter(file=>file.status==='partial').length}</b> teilweise</span><span><b>${data.files.filter(file=>file.status==='skipped').length}</b> ubersprungen</span>`;document.getElementById('stamp').textContent=token?'Lokaler Themenindex':'Beispieldaten';}
const connector='http://127.0.0.1:43127';
let token='',generation=0,healthTimer,controller=new AbortController();
const progressLabels=['Bestand erfassen','Inhalte lesen','Themen zuordnen','Wissensindex pruefen','Landkarte bereitstellen'];
let latestProgress=null,progressTimer;
const refreshElement=id=>document.getElementById('refresh-'+id);
function formatDuration(seconds){return seconds<60?seconds+' s':Math.floor(seconds/60)+' min '+seconds%60+' s';}
function updateProgressClock(){if(!latestProgress?.started)return;const now=Date.now();refreshElement('elapsed').textContent='Laufzeit: '+formatDuration(Math.max(0,Math.floor((now-Date.parse(latestProgress.started))/1000)));const age=Math.max(0,Math.floor((now-Date.parse(latestProgress.updated))/1000));refreshElement('updated').textContent='Letzte Meldung vor '+formatDuration(age);refreshElement('stale').textContent=latestProgress.state==='running'&&age>=15?'Seit '+formatDuration(age)+' keine neue Fortschrittsmeldung. Der aktuelle Arbeitsschritt ist noch nicht abgeschlossen.':'';}
function clearProgress(){clearInterval(progressTimer);latestProgress=null;refreshElement('progress').hidden=true;for(const id of ['summary','phase','counter','elapsed','updated','current','counts','stale','phases','events'])refreshElement(id).replaceChildren();refreshElement('bar').value=0;}
function showProgress(result){latestProgress=result;refreshElement('progress').hidden=false;const phase=result.phase||0;const done=result.state==='completed';refreshElement('summary').textContent=result.state==='failed'?'Aktualisierung fehlgeschlagen':done?'Aktualisierung abgeschlossen':phase?progressLabels[phase-1]:'Aktualisierung wird vorbereitet';refreshElement('phase').textContent=phase?'Phase '+phase+' von 5':'';const known=result.total>0;if(known){const percent=Math.min(100,Math.floor(result.processed/result.total*100));refreshElement('bar').value=percent;refreshElement('counter').textContent=result.processed+' / '+result.total+(phase===3?' Zuordnungsschritte':' Dateien')+' \u00b7 '+percent+' % dieser Phase';}else{refreshElement('bar').removeAttribute('value');refreshElement('counter').textContent=phase===1?result.processed+' Dateien gefunden. Gesamtzahl wird ermittelt.':'Vorbereitung laeuft';}if(done||result.state==='failed'){refreshElement('bar').value=done?100:0;if(done)refreshElement('counter').textContent='Gepruefter Index uebernommen';}refreshElement('current').textContent=result.current?'Aktuell: '+result.current:'';refreshElement('counts').textContent=(result.evaluated||0)+' ausgewertet \u00b7 '+(result.partial||0)+' teilweise \u00b7 '+(result.skipped||0)+' uebersprungen';refreshElement('phases').innerHTML=progressLabels.map((label,index)=>{const state=done||index+1<phase?'done':index+1===phase?'active':'pending';return '<li data-state="'+state+'"><strong>'+label+'</strong><span>'+(state==='done'?'Abgeschlossen':state==='active'?(result.state==='failed'?'Fehlgeschlagen':'In Arbeit'):'Ausstehend')+'</span></li>';}).join('');refreshElement('events').replaceChildren();for(const event of result.events||[]){const item=document.createElement('li');item.textContent=new Date(event.at).toLocaleTimeString()+' \u00b7 '+(event.state==='completed'?'Index bereit':event.state==='failed'?'Fehlgeschlagen':event.phase?progressLabels[event.phase-1]:'Verarbeitung gestartet');refreshElement('events').append(item);}updateProgressClock();}
const connectionElement=id=>document.getElementById('connection-'+id);
function showError(message){connectionElement('error').textContent=message;connectionElement('error').hidden=!message;}
function replaceData(next){data=next;topicById=new Map(data.topics.map(topic=>[topic.id,topic]));fileByPath=new Map(data.files.map(file=>[file.path,file]));overrides={};editingPath='';document.getElementById('assignment').close();document.getElementById('assignment-path').textContent='';document.getElementById('assignment-options').replaceChildren();document.getElementById('notice').hidden=true;updateOrganisations();document.getElementById('reset').click();updateStats();}
function clearConnection(message=''){const previous=token;generation++;controller.abort();controller=new AbortController();token='';clearInterval(healthTimer);clearProgress();replaceData(demoData);connectionElement('status').textContent='Beispieldaten · Nicht verbunden';connectionElement('directory').textContent='Kein Verzeichnis verbunden';connectionElement('updated').textContent='Aktualisierungsstand: Beispieldaten';document.getElementById('connect').hidden=false;document.getElementById('connect').disabled=false;document.getElementById('refresh').hidden=true;document.getElementById('refresh').disabled=false;document.getElementById('disconnect').hidden=true;showError(message);if(previous)fetch(connector+'/disconnect',{method:'POST',headers:{Authorization:'Bearer '+previous},keepalive:true,signal:AbortSignal.timeout(3000)}).catch(()=>{});}
async function request(path,method='GET'){const response=await fetch(connector+path,{method,headers:token?{Authorization:'Bearer '+token}:{},cache:'no-store',signal:AbortSignal.any([controller.signal,AbortSignal.timeout(10000)])});if(!response.ok)throw Error('Lokaler Dienst: HTTP '+response.status);return response.json();}
function applySnapshot(snapshot){if(!snapshot.directory||!snapshot.updated||!Array.isArray(snapshot.inventory?.files)||!Array.isArray(snapshot.inventory?.topics))throw Error('Ungueltiger Themenindex');replaceData(snapshot.inventory);connectionElement('status').textContent='Verbunden · Lokaler Themenindex';connectionElement('directory').textContent=snapshot.directory;connectionElement('updated').textContent='Aktualisierungsstand: '+new Date(snapshot.updated).toLocaleString('de-CH');document.getElementById('connect').disabled=false;document.getElementById('connect').hidden=true;document.getElementById('refresh').hidden=false;document.getElementById('disconnect').hidden=false;showError('');}
document.getElementById('connect').addEventListener('click',async()=>{showError('');const current=++generation;document.getElementById('connect').disabled=true;connectionElement('status').textContent='Lokaler Dienst wird geprueft';try{const health=await request('/health');if(health.service!=='ai-os-connector')throw Error('Falscher Dienst');if(current===generation)location.assign(connector+'/pair?app='+encodeURIComponent(location.href.split('#')[0]));}catch(error){if(current===generation)clearConnection('Lokaler Dienst nicht erreichbar. connector.ps1 mit diesem Seiten-Ursprung starten; lokalen Netzwerkzugriff im Browser erlauben. '+error.message);}});
async function finishPairing(secret){const current=generation;token=secret;connectionElement('status').textContent='Themenindex wird geladen';try{const snapshot=await request('/session');if(current!==generation)return;applySnapshot(snapshot);healthTimer=setInterval(async()=>{if(document.getElementById('refresh').disabled)return;try{await request('/status');}catch{if(current===generation)clearConnection('Verbindung verloren. Interne Inhalte wurden entfernt.');}},15000);}catch(error){if(current===generation)clearConnection(error.message);}}
document.getElementById('refresh').addEventListener('click',async()=>{const current=generation;const button=document.getElementById('refresh');button.disabled=true;showError('');clearProgress();connectionElement('status').textContent='Verbunden · Aktualisierung laeuft. Bisheriger Index bleibt sichtbar.';try{let progress=await request('/refresh','POST');if(current!==generation)return;showProgress(progress);progressTimer=setInterval(updateProgressClock,1000);while(progress.state==='running'){await new Promise(resolve=>setTimeout(resolve,750));if(current!==generation)return;progress=await request('/progress');if(current!==generation)return;showProgress(progress);}if(progress.state==='failed'){connectionElement('status').textContent='Verbunden · Aktualisierung fehlgeschlagen';showError((progress.error||'Indexaufbau fehlgeschlagen.')+' Der bisherige Index bleibt unveraendert.');return;}if(progress.state!=='completed')throw Error('Ungueltiger Fortschrittsstatus');const snapshot=await request('/session');if(current===generation)applySnapshot(snapshot);}catch(error){if(current===generation)clearConnection('Aktualisierung fehlgeschlagen. '+error.message);}finally{if(current===generation){clearInterval(progressTimer);button.disabled=false;}}});
document.getElementById('disconnect').addEventListener('click',()=>{clearConnection();document.getElementById('connect').hidden=false;});
addEventListener('pagehide',()=>clearConnection());
addEventListener('pageshow',event=>{if(event.persisted)clearConnection();});
updateOrganisations();updateStats();
let pairingToken=new URLSearchParams(location.hash.slice(1)).get('ai-os-token');
if(pairingToken){history.replaceState(null,'',location.pathname+location.search);finishPairing(pairingToken);pairingToken='';}
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(state.view==='topics')render();},150);});
render();
</script>
