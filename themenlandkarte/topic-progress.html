<style>
.topic-build{margin:18px 0;border-top:1px solid #d6ddd8;padding-top:12px}.topic-build[hidden]{display:none}.topic-build-heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}.topic-build h2{font-size:16px;margin:0}.topic-build label,.topic-build-summary{font-size:12px;color:#5b6661}.topic-build label{display:flex;gap:8px;align-items:center;margin:10px 0}.topic-build-scroll{max-height:340px;overflow:auto;scrollbar-gutter:stable;border-block:1px solid #d6ddd8}.topic-build table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}.topic-build th,.topic-build td{padding:9px 8px;text-align:left;border-bottom:1px solid #e1e7e3;overflow-wrap:anywhere;vertical-align:middle}.topic-build thead th{position:sticky;top:0;background:#f1f5f3;z-index:1;color:#5b6661;font-weight:500}.topic-build th:first-child{width:41%}.topic-build th:nth-child(2){width:21%}.topic-build th:nth-child(3),.topic-build th:nth-child(4){width:9%}.topic-build th:last-child{width:20%}.topic-build-name{display:block;font-weight:500}.topic-build-group{display:block;font-size:11px;color:#5b6661;margin-top:3px}.topic-build meter{width:100%;height:8px;display:block;margin-top:4px;accent-color:#287556}.topic-build meter::-webkit-meter-bar{background:#e2e9e5;border:0;border-radius:2px}.topic-build meter::-webkit-meter-optimum-value{background:#287556;border-radius:2px}.topic-build meter::-moz-meter-bar{background:#287556}.topic-build tr[data-state=active]{background:#e6f2ec;color:#18674b}.topic-build tr[data-state=ready] td:last-child{color:#18674b}.topic-build tr[data-state=pending],.topic-build tr[data-state=empty]{color:#6b756f}@media(max-width:600px){.topic-build thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.topic-build table,.topic-build tbody{display:block}.topic-build tr{display:grid;grid-template-columns:minmax(0,1fr) 100px;padding:5px 0;border-bottom:1px solid #d6ddd8}.topic-build th,.topic-build td{width:auto!important;border:0;padding:4px 8px}.topic-build th[scope=row]{grid-column:1/-1}.topic-build td:nth-child(2){grid-column:1;grid-row:2}.topic-build td:nth-child(2)::before{content:'Dokumente: '}.topic-build td:nth-child(3){grid-column:1;grid-row:3}.topic-build td:nth-child(3)::before{content:'Text: '}.topic-build td:nth-child(4){grid-column:2;grid-row:3}.topic-build td:nth-child(4)::before{content:'Verweis: '}.topic-build td:nth-child(5){grid-column:2;grid-row:2}}
</style>
<section id="topic-build" class="topic-build" aria-label="Themenaufbau" hidden><div class="topic-build-heading"><h2>Themenaufbau</h2><span id="topic-build-summary" class="topic-build-summary"></span></div><label><input id="topic-build-filter" type="checkbox">Nur Themen mit Beleg</label><div class="topic-build-scroll" id="topic-build-scroll"><table id="topic-build-table"><thead><tr><th scope="col">Thema</th><th scope="col">Dokumente</th><th scope="col">Text</th><th scope="col">Verweis</th><th scope="col">Stand</th></tr></thead><tbody id="topic-build-rows"></tbody></table><p id="topic-build-empty" hidden>Noch keine Themen mit Beleg</p></div></section>
<script>
(()=>{
 const root=document.getElementById('topic-build'),body=document.getElementById('topic-build-rows'),filter=document.getElementById('topic-build-filter'),scroll=document.getElementById('topic-build-scroll');
 const states={pending:'Ausstehend',active:'In Pruefung',found:'Mit Beleg',ready:'\u2713 Zugeordnet',empty:'Ohne Beleg'};let latest=null;
 const append=(parent,tag,text,className)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;parent.append(node);return node;};
 globalThis.renderTopicBuild=result=>{latest=result;const topics=Array.isArray(result.topicBuild)?result.topicBuild:[];root.hidden=!topics.length;const visible=filter.checked?topics.filter(topic=>topic.documents>0):topics;const maximum=Math.max(1,...topics.map(topic=>Number(topic.documents)||0));document.getElementById('topic-build-summary').textContent=topics.filter(topic=>topic.documents>0).length+' / '+topics.length+' Themen mit Beleg';const fragment=document.createDocumentFragment();for(const topic of visible){const row=append(fragment,'tr');row.dataset.state=Object.hasOwn(states,topic.state)?topic.state:'pending';const heading=append(row,'th');heading.scope='row';append(heading,'span',topic.label,'topic-build-name');append(heading,'span',topic.group,'topic-build-group');const documents=append(row,'td',topic.documents);const meter=append(documents,'meter');meter.min=0;meter.max=maximum;meter.value=Number(topic.documents)||0;meter.setAttribute('aria-label','Dokumente zu '+topic.label);meter.setAttribute('aria-valuetext',topic.documents+' Dokumente');append(row,'td',topic.textAssignments);append(row,'td',topic.referenceAssignments);append(row,'td',states[row.dataset.state]);}const position=scroll.scrollTop;body.replaceChildren(fragment);scroll.scrollTop=position;document.getElementById('topic-build-empty').hidden=visible.length>0;};
 globalThis.clearTopicBuild=()=>{latest=null;root.hidden=true;filter.checked=false;body.replaceChildren();document.getElementById('topic-build-summary').textContent='';document.getElementById('topic-build-empty').hidden=true;scroll.scrollTop=0;};
 filter.addEventListener('change',()=>{if(latest)globalThis.renderTopicBuild(latest);});
})();
</script>
