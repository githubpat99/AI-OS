<style>
.reader-header{display:block;background:#fff}
.reader-reason{max-height:90px;overflow:auto}.reader-content.reader-error{white-space:pre-wrap}
.reader-state{margin:8px 0;font-size:11px}.reader-state dl{display:grid;grid-template-columns:145px minmax(0,1fr);gap:3px 8px;margin:6px 0}.reader-state dt{color:#5b6661}.reader-state dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}#reader-processing{margin:5px 0;font-weight:600}#reader-processing[data-state=current]{color:#18674b}#reader-processing[data-state=processing]{color:#225e92}#reader-processing[data-state=stale]{color:#87580d}#reader-processing[data-state=error],#reader-state-error{color:#a13840}#reader-state-error{max-height:45px;overflow:auto;margin:4px 0}@media(max-width:700px){.reader-state dl{grid-template-columns:125px minmax(0,1fr)}.reader-state{max-height:205px;overflow:auto}}
body.reader-open{padding-right:min(720px,46vw)}.document-reader[hidden]{display:none}.document-reader{position:fixed;inset:0 0 0 auto;width:min(720px,46vw);z-index:30;background:#fff;border-left:1px solid #bdcbc4;box-shadow:-5px 0 22px #202b2810;display:flex;flex-direction:column;color:#202b28}.reader-header{padding:18px 20px 12px;border-bottom:1px solid #d6ddd8;flex:none}.reader-title-row{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}.reader-title-row h2{font-size:21px;line-height:1.3;margin:0;overflow-wrap:anywhere;letter-spacing:0}.reader-icon{width:36px;height:36px;flex:none;border:1px solid #d6ddd8;background:#fff;border-radius:4px;cursor:pointer;font-size:20px}.reader-path{font-size:11px;color:#5b6661;overflow-wrap:anywhere;margin:8px 0}.reader-coverage{display:inline-block;font-size:12px;padding:3px 7px;background:#e6f1e9;color:#18674b;border-radius:3px}.reader-coverage[data-status=partial]{background:#faf0d7;color:#785413}.reader-coverage[data-status=skipped]{background:#f8e9e9;color:#93343c}.reader-reason{font-size:12px;color:#5b6661;overflow-wrap:anywhere;margin:8px 0}.reader-tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 8px}.reader-tools button{border:1px solid #c9d6ce;background:#f6f9f6;border-radius:4px;padding:7px 10px;cursor:pointer;font:inherit;font-size:12px}.reader-tools button:disabled{opacity:.55;cursor:not-allowed}.reader-ai-state{font-size:11px;color:#785413;margin:5px 0}.reader-navigation{display:flex;gap:8px;align-items:center;margin-top:12px}.reader-navigation input,.reader-navigation select{min-width:0;width:100%;height:36px;border:1px solid #c9d6ce;border-radius:4px;padding:5px 8px;background:#fff;font:inherit;font-size:12px}.reader-navigation label{flex:1;min-width:0}.reader-hit-count{font-size:12px;color:#5b6661;min-height:18px;margin:6px 0}.reader-content{overflow:auto;flex:1;min-height:0;padding:20px 24px;scroll-behavior:smooth;overscroll-behavior:contain}.reader-content p{font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 9px}.reader-content h2,.reader-content h3,.reader-content h4,.reader-content h5,.reader-content h6{overflow-wrap:anywhere;letter-spacing:0;scroll-margin-top:12px;margin:23px 0 12px;font-size:18px;line-height:1.4}.reader-content h3{font-size:16px}.reader-content mark,.search-snippet mark{background:#ffed9f;color:#202b28;padding:0 1px}.reader-content mark[data-current=true]{outline:2px solid #87580d;border-radius:1px}.reader-footer{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 16px;border-top:1px solid #d6ddd8;font-size:11px;color:#5b6661}.reader-page-buttons{display:flex;gap:6px}.reader-footer button{font-size:15px;width:32px;height:30px;background:#fff;border:1px solid #c9d6ce;border-radius:4px;cursor:pointer}.document-link{border:0;background:none;color:#225e92;text-align:left;padding:0;font:inherit;cursor:pointer;overflow-wrap:anywhere;max-width:100%;text-decoration:underline;text-decoration-color:#c4d4df;text-underline-offset:3px}.search-snippet{display:block;width:100%;text-align:left;margin:8px 0;padding:9px 12px;border:0;border-left:3px solid #b1c8b9;background:#f2f7f3;font:inherit;font-size:12px;line-height:1.65;white-space:pre-wrap;color:#202b28;overflow-wrap:anywhere;cursor:pointer}.search-snippet small{display:block;color:#5b6661;margin-bottom:3px}.search-state{font-size:12px;color:#5b6661;margin:4px 0 12px}.reader-error{color:#93343c!important}@media(max-width:700px){body.reader-open{padding-right:0}.document-reader{width:100%}.reader-header{padding:14px 16px 10px}.reader-content{padding:16px}.reader-title-row h2{font-size:19px}.reader-tools{gap:6px}.reader-navigation{flex-wrap:wrap}.reader-navigation label{flex-basis:100%}}
</style>
<section id="document-reader" class="document-reader" aria-label="Dokumentleser" hidden>
<p id="reader-action" class="reader-reason" role="status" aria-live="polite" hidden></p>
<header class="reader-header"><div class="reader-title-row"><h2 id="reader-title" tabindex="-1">Dokument</h2><button id="reader-close" class="reader-icon" aria-label="Dokumentleser schliessen" title="Dokumentleser schliessen">&times;</button></div><p id="reader-path" class="reader-path"></p><span id="reader-coverage" class="reader-coverage"></span><p id="reader-reason" class="reader-reason"></p><div class="reader-tools"><button id="reader-original">&#8599; Original &ouml;ffnen</button><button id="reader-download">&#8595; Herunterladen</button><button id="reader-ask" disabled title="Noch nicht verfuegbar: keine KI-Anbindung">Zum Dokument fragen</button></div><p class="reader-ai-state">Zum Dokument fragen: noch nicht verf&uuml;gbar. Keine KI-Anbindung.</p><div class="reader-navigation"><label><select id="reader-headings" aria-label="Ueberschriftennavigation"><option value="">Abschnitt waehlen</option></select></label></div><div class="reader-navigation"><label><input id="reader-search" type="search" placeholder="Im Dokument suchen" aria-label="Im Dokument suchen" maxlength="300"></label><button id="reader-hit-prev" class="reader-icon" aria-label="Vorheriger Suchtreffer" title="Vorheriger Suchtreffer">&uarr;</button><button id="reader-hit-next" class="reader-icon" aria-label="Naechster Suchtreffer" title="Naechster Suchtreffer">&darr;</button></div><p id="reader-hit-count" class="reader-hit-count" role="status" aria-live="polite"></p></header>
<div id="reader-content" class="reader-content" tabindex="0" aria-label="Gelesener Dokumentinhalt"></div><footer class="reader-footer"><span id="reader-range"></span><div class="reader-page-buttons"><button id="reader-page-prev" aria-label="Vorheriger Textbereich" title="Vorheriger Textbereich">&larr;</button><button id="reader-page-next" aria-label="Naechster Textbereich" title="Naechster Textbereich">&rarr;</button></div></footer>
</section>
<template id="reader-state-template"><section class="reader-state" aria-label="Dokumentstand und Indexstand"><p id="reader-processing" role="status" aria-live="polite"></p><dl><dt>Quelldatei geaendert</dt><dd id="reader-source-time"></dd><dt>Letzte erfolgreiche Auswertung</dt><dd id="reader-evaluation-time"></dd><dt>Letzter Verzeichnisabgleich</dt><dd id="reader-sync-time"></dd><dt>Ausgewerteter Quellstand</dt><dd id="reader-index-source-time"></dd><dt>Quell-Hash</dt><dd id="reader-source-hash"></dd><dt>Index-Hash</dt><dd id="reader-index-hash"></dd></dl><p id="reader-state-error"></p></section></template>
<script>
globalThis.formatZurichTime=value=>value&&!Number.isNaN(Date.parse(value))?new Intl.DateTimeFormat('de-CH',{timeZone:'Europe/Zurich',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',timeZoneName:'short',hour12:false}).format(new Date(value)):'Nicht vorhanden';
(()=>{
 const element=id=>document.getElementById('reader-'+id);
 const panel=document.getElementById('document-reader');
 panel.querySelector('.reader-header').insertBefore(document.getElementById('reader-state-template').content.cloneNode(true),panel.querySelector('.reader-tools'));
 const editButton=document.createElement('button');editButton.id='reader-edit';editButton.textContent='In VS Code bearbeiten';editButton.disabled=true;editButton.hidden=true;panel.querySelector('.reader-tools').prepend(editButton);
 element('original').textContent='In zugehoeriger Anwendung oeffnen';
 const windowSize=90000;
 let options={},documentData=null,epoch=0,hitIndex=0,hits=[],windowStart=0,previousFocus=null,queryTimer;
 const urls=new Set();
 const coverage={evaluated:'Vollstaendig ausgelesen',partial:'Teilweise ausgelesen',skipped:'Nicht ausgelesen'};
 const escapeRegex=value=>value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 function close(){epoch++;clearTimeout(queryTimer);documentData=null;hits=[];hitIndex=0;windowStart=0;panel.hidden=true;document.body.classList.remove('reader-open');for(const id of ['content','headings','title','path','reason','coverage','hit-count','range','action'])element(id).replaceChildren();clearDocumentState();editButton.disabled=true;editButton.hidden=true;element('action').hidden=true;element('search').value='';for(const url of urls)URL.revokeObjectURL(url);urls.clear();if(previousFocus?.isConnected)previousFocus.focus();previousFocus=null;dispatchEvent(new Event('resize'));}
 function clearDocumentState(){for(const id of ['processing','source-time','evaluation-time','sync-time','index-source-time','source-hash','index-hash','state-error']){element(id).replaceChildren();element(id).removeAttribute('title');}element('processing').removeAttribute('data-state');}
 function displayDocumentState(state){if(!state){clearDocumentState();return;}const labels={current:'Aktuell',stale:'Veraltet: Quelldatei und gelesener Index unterscheiden sich',processing:'Verarbeitung laeuft; bisheriger Index bleibt sichtbar',error:'Verarbeitung fehlgeschlagen; bisheriger erfolgreicher Stand bleibt erhalten',unread:'Noch keine erfolgreiche Auswertung',demo:'Beispieldaten'};element('processing').dataset.state=state.state;element('processing').textContent=labels[state.state]||'Stand wird geprueft';element('source-time').textContent=formatZurichTime(state.sourceModified);element('evaluation-time').textContent=formatZurichTime(state.evaluatedAt);element('sync-time').textContent=formatZurichTime(state.directorySyncedAt);element('index-source-time').textContent=formatZurichTime(state.indexedModified);for(const [id,value] of [['source-hash',state.sourceHash],['index-hash',state.indexedHash]]){element(id).textContent=value?value.slice(0,16)+'...'+value.slice(-8):'Nicht vorhanden';element(id).title=value||'';}element('state-error').textContent=state.error||'';}
 function terms(){return [...new Set(element('search').value.trim().split(/\s+/).filter(Boolean))].slice(0,12);}
 function updateHits(){hits=[];hitIndex=0;if(!documentData)return;const words=terms();if(words.length){const pattern=new RegExp(words.map(escapeRegex).join('|'),'giu');let match;while((match=pattern.exec(documentData.text))&&hits.length<10000)hits.push({offset:match.index,length:match[0].length});}element('hit-count').textContent=words.length?(hits.length===10000?'Mindestens 10000 Treffer':hits.length+' Treffer'):'Keine Dokumentsuche aktiv';element('hit-prev').disabled=!hits.length;element('hit-next').disabled=!hits.length;}
 function appendMarked(parent,text,offset){let position=0;for(const hit of hits){if(hit.offset+hit.length<=offset)continue;if(hit.offset>=offset+text.length)break;const start=Math.max(0,hit.offset-offset),end=Math.min(text.length,hit.offset+hit.length-offset);if(start>position)parent.append(document.createTextNode(text.slice(position,start)));const mark=document.createElement('mark');mark.textContent=text.slice(start,end);mark.dataset.offset=String(hit.offset);mark.dataset.current=String(hits[hitIndex]===hit);parent.append(mark);position=end;}parent.append(document.createTextNode(text.slice(position)));}
 function showWindow(target=windowStart){if(!documentData)return;const text=documentData.text;windowStart=Math.max(0,Math.floor(Math.min(target,Math.max(0,text.length-1))/windowSize)*windowSize);let end=Math.min(text.length,windowStart+windowSize);const fragment=document.createDocumentFragment();let offset=windowStart;const excerpt=text.slice(windowStart,end);for(const line of excerpt.split(/\n/)){const visible=line.replace(/\r$/,'');const heading=(documentData.headings||[]).find(item=>item.offset===offset);const node=document.createElement(heading?'h'+Math.min(6,Math.max(2,heading.level+1)):'p');if(heading){node.id='reader-'+heading.id;const content=visible.replace(/^#{1,6}\s+/,'');appendMarked(node,content,offset+visible.length-content.length);}else appendMarked(node,visible,offset);fragment.append(node);offset+=line.length+1;}element('content').replaceChildren(fragment);element('content').scrollTop=0;element('range').textContent=text.length?'Zeichen '+(windowStart+1)+'-'+end+' von '+text.length:'Kein lesbarer Inhalt';element('page-prev').disabled=windowStart===0;element('page-next').disabled=end>=text.length;}
 function goTo(offset){showWindow(offset);requestAnimationFrame(()=>{const mark=element('content').querySelector('mark[data-offset="'+offset+'"]');if(mark)mark.scrollIntoView({block:'center'});else{const heading=(documentData?.headings||[]).find(item=>item.offset===offset);if(heading)document.getElementById('reader-'+heading.id)?.scrollIntoView({block:'start'});}});}
 async function open(path,offset){const current=++epoch;previousFocus=document.activeElement;documentData=null;hits=[];panel.hidden=false;document.body.classList.add('reader-open');element('title').textContent='Dokument wird geladen';element('path').textContent=path;element('reason').textContent='';element('reason').classList.remove('reader-error');element('content').replaceChildren();element('content').classList.remove('reader-error');element('coverage').textContent='';element('headings').replaceChildren();element('hit-count').textContent='';element('range').textContent='';element('original').disabled=true;element('download').disabled=true;element('title').focus();dispatchEvent(new Event('resize'));try{const result=await options.getDocument(path);if(current!==epoch)return;documentData=result;documentData.text=String(result.text||'');element('title').textContent=result.title||path;element('coverage').textContent=(result.demo?'Beispieldaten · ':'')+(coverage[result.status]||'Nicht ausgelesen');element('coverage').dataset.status=result.status;element('reason').textContent=[result.extraction,result.reason].filter(Boolean).join('. ');const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Abschnitt waehlen';element('headings').append(placeholder);for(const heading of result.headings||[]){const item=document.createElement('option');item.value=heading.offset;item.textContent=heading.title;element('headings').append(item);}element('headings').disabled=!(result.headings?.length);element('search').value=options.getQuery?.()||'';updateHits();if(!documentData.text){element('content').textContent='Fuer dieses Dokument liegt kein gelesener Inhalt vor. '+(result.reason||'');element('range').textContent='Nicht ausgelesen';}else goTo(Number.isFinite(offset)?offset:(hits[0]?.offset||0));element('original').disabled=!options.canOpenOriginal();element('download').disabled=!options.canOpenOriginal();}catch(error){if(current!==epoch)return;element('title').textContent='Dokument nicht verfuegbar';element('content').textContent=error.message;element('content').classList.add('reader-error');}}
 async function original(download,edit=false){if(!documentData)return;const current=epoch;try{if(edit)await options.editInCode(documentData.path);else if(download){const result=await options.downloadOriginal(documentData.path);if(current!==epoch)return;const url=URL.createObjectURL(result.blob);urls.add(url);const anchor=document.createElement('a');anchor.href=url;anchor.download=result.name;anchor.click();setTimeout(()=>{URL.revokeObjectURL(url);urls.delete(url);},1000);}else await options.openOriginal(documentData.path);if(current!==epoch)return;element('action').textContent=download?'Original an den Browser uebergeben.':edit?'VS Code geoeffnet. Gespeicherte Aenderungen werden automatisch eingelesen.':'Zugehoerige Anwendung geoeffnet. Gespeicherte Aenderungen werden automatisch eingelesen.';element('action').classList.remove('reader-error');element('action').hidden=false;}catch(error){if(current!==epoch)return;element('action').textContent=error.message;element('action').classList.add('reader-error');element('action').hidden=false;}}
 async function openTracked(path,offset){clearDocumentState();editButton.disabled=true;editButton.hidden=true;const expected=epoch+1;await open(path,offset);if(expected!==epoch||!documentData)return;displayDocumentState(documentData.documentState||{state:documentData.demo?'demo':'unread',sourceModified:documentData.modified});editButton.hidden=!documentData.canEditInCode||!options.canOpenOriginal();editButton.disabled=editButton.hidden;}
 async function refresh(){if(!documentData)return;const current=epoch,path=documentData.path,query=element('search').value,position=element('content').scrollTop,section=element('headings').value;const next=await options.getDocument(path);if(current!==epoch||!documentData||documentData.path!==path)return;documentData=next;documentData.text=String(next.text||'');element('title').textContent=next.title||path;element('coverage').textContent=coverage[next.status]||'Nicht ausgelesen';element('coverage').dataset.status=next.status;element('reason').textContent=[next.extraction,next.reason].filter(Boolean).join('. ');element('headings').replaceChildren();const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Abschnitt waehlen';element('headings').append(placeholder);for(const heading of next.headings||[]){const item=document.createElement('option');item.value=heading.offset;item.textContent=heading.title;element('headings').append(item);}element('headings').value=section;element('headings').disabled=!(next.headings?.length);element('search').value=query;updateHits();showWindow(windowStart);element('content').scrollTop=position;displayDocumentState(next.documentState);editButton.hidden=!next.canEditInCode||!options.canOpenOriginal();editButton.disabled=editButton.hidden;}
 element('close').addEventListener('click',close);
 panel.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();close();}});
 element('headings').addEventListener('change',()=>{if(element('headings').value!=='')goTo(Number(element('headings').value));});
 element('search').addEventListener('input',()=>{clearTimeout(queryTimer);queryTimer=setTimeout(()=>{updateHits();goTo(hits[0]?.offset||0);},150);});
 for(const [id,direction] of [['hit-prev',-1],['hit-next',1]])element(id).addEventListener('click',()=>{if(!hits.length)return;hitIndex=(hitIndex+direction+hits.length)%hits.length;element('hit-count').textContent=(hitIndex+1)+' / '+hits.length+' Treffer';goTo(hits[hitIndex].offset);});
 element('page-prev').addEventListener('click',()=>showWindow(Math.max(0,windowStart-windowSize)));
 element('page-next').addEventListener('click',()=>showWindow(windowStart+windowSize));
 element('original').addEventListener('click',()=>original(false));element('download').addEventListener('click',()=>original(true));
 editButton.addEventListener('click',()=>original(false,true));
 globalThis.aiDocumentReader={configure:value=>{options=value;},open:openTracked,clear:close,refresh,currentPath:()=>panel.hidden?null:element('path').textContent,updateState:state=>{if(state&&state.path===documentData?.path){documentData.documentState=state;displayDocumentState(state);}}};
})();
</script>
